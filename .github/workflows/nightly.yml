# Every night (and on demand): the app tests on older and newer iOS versions, other screen sizes and
# older Xcode versions than the push CI. Only simulators and Xcodes already on GitHub's runner images are
# used, so no job downloads a runtime; see the "Installed Simulators" section of each image's readme:
# https://github.com/actions/runner-images/tree/main/images/macos
# No runner image has iOS 16 (the minimum), so 17.0 is the oldest tested here.
name: Nightly

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

concurrency:
  group: nightly
  cancel-in-progress: true

jobs:
  app:
    name: iOS ${{ matrix.ios }} · ${{ matrix.device }} · Xcode ${{ matrix.xcode }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-14, xcode: "16.2", ios: "17.0", device: "iPhone SE (3rd generation)" }
          - { runner: macos-15, xcode: "16.4", ios: "18.6", device: "iPhone 16 Pro Max" }
          - { runner: macos-15, xcode: "26.0.1", ios: "26.0", device: "iPad (A16)" }
          - { runner: macos-26, xcode: "26.6", ios: "26.5", device: "iPhone 17e" }
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode ${{ matrix.xcode }}
        run: |
          sudo xcode-select -s "/Applications/Xcode_${{ matrix.xcode }}.app"
          xcodebuild -version
      - run: brew install xcodegen xcbeautify
      - name: Tests
        env:
          SIM_DEVICE: ${{ matrix.device }}
          SIM_RUNTIME: ${{ matrix.ios }}
        run: scripts/test-app.sh
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: TestResults-iOS-${{ matrix.ios }}-${{ matrix.runner }}
          path: .build/TestResults.xcresult
