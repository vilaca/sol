# Uploads a build to TestFlight when a v* tag is pushed, or on demand (choose TestFlight or App Store).
# Needs these repository secrets: ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8, DEVELOPMENT_TEAM, APP_BUNDLE_ID.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      lane:
        description: "beta = TestFlight, release = App Store Connect"
        type: choice
        options: [beta, release]
        default: beta

jobs:
  upload:
    runs-on: macos-15
    environment: app-store
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - run: brew install xcodegen
      - run: bundle exec fastlane ${{ inputs.lane || 'beta' }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
          APP_BUNDLE_ID: ${{ secrets.APP_BUNDLE_ID }}
          TESTFLIGHT_CHANGELOG: ${{ github.ref_name }}
